<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WWII Camp Tour</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

  <style>
    body {
      margin: 0;
      background: #171b16;
    }

    #camp {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="camp" aria-label="Interactive World War II camp tour"></div>

  <script>
    pannellum.viewer('camp', {
      type: 'equirectangular',
      panorama: './camp.png',
      autoLoad: true,

      haov: 100,
      vaov: 51,
      hfov: 72,
      minHfov: 35,
      maxHfov: 95,
      minYaw: -50,
      maxYaw: 50,
      minPitch: -25.5,
      maxPitch: 25.5,
      avoidShowingBackground: false,
      hotSpotDebug: false,

      hotSpots: [
        {
          // Front left
          pitch: -2,
          yaw: -25,
          type: 'info',
          text: 'Enter Ernest Childers’s tent',
          URL: './childers-tent.html',
          attributes: { target: '_self' }
        },
        {
          // Second on the left
          pitch: 1,
          yaw: -8,
          type: 'info',
          text: 'Enter Chester Nez’s tent',
          URL: './nez-tent.html',
          attributes: { target: '_self' }
        },
        {
          // Front right
          pitch: -2,
          yaw: 29,
          type: 'info',
          text: 'Enter Joe Medicine Crow’s tent',
          URL: './medicine-crow-tent.html',
          attributes: { target: '_self' }
        },
        {
          // Second on the right, above Marcella’s sign
          pitch: 6,
          yaw: 20,
          type: 'info',
          text: 'Enter Marcella LeBeau’s tent',
          URL: './lebeau-tent.html',
          attributes: { target: '_self' }
        }
      ]
    });
  </script>
</body>
</html>
